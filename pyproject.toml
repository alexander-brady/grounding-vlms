[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-counting"
dynamic = ["version"]
description = "Testing counting capabilities of vision-language models."
authors = [
    { name = "Alexander Brady" },
    { name = "Tim Eilers" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "word2number>=1.1",
]

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "mypy>=1.18.2",
    "ruff>=0.14.0",
]

[project.urls]
github = "https://github.com/alexander-brady/grounding-vlms"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # basics: style, flakes, isort, pyupgrade, bugbear
ignore = ["E501"]                    # let the formatter handle wrapping

[tool.ruff.lint.isort]
known-first-party = ["vl_saliency"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["\\.venv", "env", "build", "dist"]
follow_imports = "skip"  # don't analyze third-party libs
ignore_missing_imports = true
